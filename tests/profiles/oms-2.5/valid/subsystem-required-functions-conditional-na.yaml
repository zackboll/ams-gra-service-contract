contract_version: "0.1"
service:
  name: profile-subsystem-conditional-na
  version: "0.1.0"
  kind: subsystem
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: local-subsystem-startup
    name: Subsystem Startup
    category: required
    required_group: subsystem
    applicability: applicable
    exchanges: []
  - id: local-subsystem-status
    name: Subsystem Status
    category: required
    required_group: subsystem
    applicability: applicable
    exchanges:
      - id: local-status-request
        kind: oms_message
        direction: input
        mandate: mandatory
        message: SubsystemStatusDataRequest
        topic: local.request.topic
        timing:
          kind: asynchronous
      - id: local-status-report
        kind: oms_message
        direction: output
        mandate: mandatory
        message: SubsystemStatus
        topic: local.report.topic
        timing:
          kind: periodic
      - id: local-status-response
        kind: oms_message
        direction: output
        mandate: mandatory
        message: SubsystemStatusDataRequestStatus
        topic: local.response.topic
        timing:
          kind: on_demand
  - id: local-subsystem-state-command
    name: Subsystem State Command Processing
    category: required
    required_group: subsystem
    applicability: not_applicable
    not_applicable_reason: This Subsystem does not process state commands.
    exchanges: []
  - id: local-subsystem-bit
    name: Subsystem Built-In Test (BIT)
    category: required
    required_group: subsystem
    applicability: not_applicable
    not_applicable_reason: This Subsystem does not perform built-in tests.
    exchanges: []
  - id: local-subsystem-calibration
    name: Subsystem Calibration
    category: required
    required_group: subsystem
    applicability: not_applicable
    not_applicable_reason: This Subsystem does not perform calibration.
    exchanges: []
  - id: local-subsystem-shutdown
    name: Subsystem Shutdown
    category: required
    required_group: subsystem
    applicability: applicable
    exchanges: []
