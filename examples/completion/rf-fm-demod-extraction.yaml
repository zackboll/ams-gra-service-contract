extraction_version: "0.1"
target: {contract_version: "0.1", oms_version: "2.5", service_kind: service, name: RF FM Demod}
sources:
  - {id: primary-contract, provenance: published_contract, title: OMS Service Contract - RF FM Demod, uri: https://github.com/open-arsenal/ams-gra-hello-world-sk-skills-rf-fm-demod/blob/af13bd2926b15253e795920c91320733a29927ea/docs/compliance/oms-service-contract.md, revision: af13bd2926b15253e795920c91320733a29927ea, local_path: docs/compliance/oms-service-contract.md, sha256: 3b3b2d22cd1c7169eb81547d1e1ad6583407ea7d3ee6184d598f1dbc7c9e40aa}
  - {id: configuration-doc, provenance: published_supporting_doc, title: RF FM Demod Configuration, uri: https://github.com/open-arsenal/ams-gra-hello-world-sk-skills-rf-fm-demod/blob/af13bd2926b15253e795920c91320733a29927ea/docs/configuration.md, revision: af13bd2926b15253e795920c91320733a29927ea, local_path: docs/configuration.md, sha256: 35d3f5f45e871a9d432ebeaf0f669297d5c499b50c938807a4320bfc39095a84}
  - {id: contracts-doc, provenance: published_supporting_doc, title: RF FM Demod External Interface Contracts, uri: https://github.com/open-arsenal/ams-gra-hello-world-sk-skills-rf-fm-demod/blob/af13bd2926b15253e795920c91320733a29927ea/docs/contracts.md, revision: af13bd2926b15253e795920c91320733a29927ea, local_path: docs/contracts.md, sha256: 9cd199802968a32beb92832b4c556efab53369bcf0059d4b2a096d100b37cc58}
rules:
  - {id: service-name, target: service.name, source: primary-contract, locator: Section 1, extractor: {kind: text_regex_capture, pattern: '^\* \*\*Service Name\*\*: (?P<value>[^\r\n]+)$', group: value, value_type: string, multiline: true}}
  - {id: service-version, target: service.version, source: primary-contract, locator: Section 1, extractor: {kind: text_regex_capture, pattern: '^\* \*\*Version\*\*: (?P<value>[^\r\n]+)$', group: value, value_type: string, multiline: true}}
  - {id: service-kind, target: service.kind, source: primary-contract, locator: Sections 1 and 3, extractor: {kind: text_regex_assert, pattern: 'AMS GRA Skill.*### 4\.1', value: service, dotall: true}}
  - {id: oms-version, target: standards.oms_version, source: primary-contract, locator: Section 1, extractor: {kind: text_regex_capture, pattern: '^\* \*\*OMS Standard Version\*\*: v(?P<value>[^\r\n]+)$', group: value, value_type: string, multiline: true}}
  - {id: uci-version, target: standards.uci_schema_version, source: primary-contract, locator: Section 2, extractor: {kind: text_regex_capture, pattern: 'Universal Command and Control Interface \(UCI\) Standard v(?P<value>[^\r\n]+)', group: value, value_type: string}}
  - {id: ams-gra-version, target: standards.ams_gra_version, source: primary-contract, locator: Section 2, extractor: {kind: text_regex_capture, pattern: 'AMS GRA v(?P<value>[^\r\n]+)', group: value, value_type: string}}
  - {id: position-selector, target: "exchange[PositionReport].selector", source: primary-contract, locator: Section 4.2, extractor: {kind: text_regex_assert, pattern: '### 4\.2\. Messages Consumed.*`PositionReport`', value: PositionReport, dotall: true}}
  - {id: position-direction, target: "exchange[PositionReport].direction", source: primary-contract, locator: Section 4.2, extractor: {kind: text_regex_assert, pattern: '### 4\.2\. Messages Consumed.*`PositionReport`', value: input, dotall: true}}
  - {id: status-selector, target: "exchange[ServiceStatus].selector", source: primary-contract, locator: Section 4.3, extractor: {kind: text_regex_assert, pattern: '### 4\.3\. Messages Produced.*`ServiceStatus`', value: ServiceStatus, dotall: true}}
  - {id: status-direction, target: "exchange[ServiceStatus].direction", source: primary-contract, locator: Section 4.3, extractor: {kind: text_regex_assert, pattern: '### 4\.3\. Messages Produced.*`ServiceStatus`', value: output, dotall: true}}
  - {id: status-timing, target: "exchange[ServiceStatus].timing.kind", source: primary-contract, locator: Section 4.3, extractor: {kind: text_regex_assert, pattern: '`ServiceStatus` \(UCI\) - Periodic', value: periodic}}
  - {id: signal-selector, target: "exchange[SignalReport].selector", source: primary-contract, locator: Section 4.3, extractor: {kind: text_regex_assert, pattern: '### 4\.3\. Messages Produced.*`SignalReport`', value: SignalReport, dotall: true}}
  - {id: signal-direction, target: "exchange[SignalReport].direction", source: primary-contract, locator: Section 4.3, extractor: {kind: text_regex_assert, pattern: '### 4\.3\. Messages Produced.*`SignalReport`', value: output, dotall: true}}
  - {id: signal-energy-trigger, target: "observation[SignalReport].publication_trigger", source: primary-contract, locator: Section 4.3, extractor: {kind: text_regex_assert, pattern: '`SignalReport` \(UCI\) - Published over OWP when FM audio energy exceeds the configured threshold\.', value: FM audio energy exceeds configured threshold}}
  - {id: position-topic, target: "exchange[PositionReport].topic", source: configuration-doc, locator: position_topic, extractor: {kind: text_regex_capture, pattern: '\| `position_topic` .*? \| `"(?P<value>[^"]+)"` \|', group: value, value_type: string}}
  - {id: status-topic, target: "exchange[ServiceStatus].topic", source: configuration-doc, locator: service_status_topic, extractor: {kind: text_regex_capture, pattern: '\| `service_status_topic` .*? \| `"(?P<value>[^"]+)"` \|', group: value, value_type: string}}
  - {id: signal-topic, target: "exchange[SignalReport].topic", source: configuration-doc, locator: signal_topic, extractor: {kind: text_regex_capture, pattern: '\| `signal_topic` .*? \| `"(?P<value>[^"]+)"` \|', group: value, value_type: string}}
  - {id: status-rate, target: "exchange[ServiceStatus].timing.nominal_rate_hz", source: configuration-doc, locator: service_status_rate_hz, extractor: {kind: text_regex_capture, pattern: '\| `service_status_rate_hz` .*? \| `(?P<value>[0-9.]+)` \|', group: value, value_type: number}}
  - {id: signal-rate-limit, target: "observation[SignalReport].report_rate_limit_hz", source: configuration-doc, locator: report_rate_limit_hz, extractor: {kind: text_regex_capture, pattern: '\| `report_rate_limit_hz` .*? \| `(?P<value>[0-9.]+)` \|', group: value, value_type: number}}
  - {id: position-direction-corroboration, target: "exchange[PositionReport].direction", source: contracts-doc, locator: UCI PositionReport subscription, extractor: {kind: text_regex_assert, pattern: '### UCI PositionReport subscription\n\n- \*\*Direction:\*\* Input', value: input}}
  - {id: status-direction-corroboration, target: "exchange[ServiceStatus].direction", source: contracts-doc, locator: UCI ServiceStatus publication, extractor: {kind: text_regex_assert, pattern: '### UCI ServiceStatus publication\n\n- \*\*Direction:\*\* Output', value: output}}
  - {id: status-timing-corroboration, target: "exchange[ServiceStatus].timing.kind", source: contracts-doc, locator: UCI ServiceStatus publication / Reliability semantics, extractor: {kind: text_regex_assert, pattern: '### UCI ServiceStatus publication.*Reliability semantics:\*\* Periodic continuous publication', value: periodic, dotall: true}}
  - {id: signal-direction-corroboration, target: "exchange[SignalReport].direction", source: contracts-doc, locator: UCI SignalReport publication, extractor: {kind: text_regex_assert, pattern: '### UCI SignalReport publication\n\n- \*\*Direction:\*\* Output', value: output}}
