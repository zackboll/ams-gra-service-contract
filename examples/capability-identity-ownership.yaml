    name: ESM Maintenance
    category: specific
    applicability: applicable
    capability: esm
    exchanges: []
  - id: radar-operations
    name: ESM Capability Enable/Disable
    category: specific
    applicability: applicable
    capability: radar
    exchanges: []
  - id: display-only-name
    name: ESM Capability Status
    category: specific
    applicability: applicable
    exchanges: []
