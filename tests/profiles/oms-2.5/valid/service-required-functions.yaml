# Complete profile-validation fixture using deliberately local IDs and
# non-upstream exchange order.
contract_version: "0.1"
service:
  name: profile-service
  version: "0.1.0"
  kind: service
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: local-bootstrap-function
    name: Service Initialization
    category: required
    required_group: service
    applicability: applicable
    exchanges:
      - id: local-config-transfer
        kind: data_transfer
        direction: input
        mandate: optional
        name: ServiceConfigFile
        protocol: HTTPS
        data_type: Deployment Configuration
        data_format: JSON
        sharing_pattern: Shared Read Only
        timing:
          kind: asynchronous
      - id: local-file-location
        kind: oms_message
        direction: input
        mandate: optional
        message: FileLocation
        topic: local.initialization.location
        timing:
          kind: asynchronous
      - id: local-file-metadata
        kind: oms_message
        direction: input
        mandate: optional
        message: FileMetadata
        topic: local.initialization.metadata
        timing:
          kind: asynchronous
  - id: local-status-function
    name: Service Status
    category: required
    required_group: service
    applicability: applicable
    exchanges:
      - id: local-response-row
        kind: oms_message
        direction: output
        mandate: mandatory
        message: ServiceStatusDataRequestStatus
        topic: integration.response
        timing:
          kind: on_demand
      - id: local-status-row
        kind: oms_message
        direction: output
        mandate: mandatory
        message: ServiceStatus
        topic: integration.status
        timing:
          kind: periodic
      - id: local-request-row
        kind: oms_message
        direction: input
        mandate: mandatory
        message: ServiceStatusDataRequest
        topic: integration.request
        timing:
          kind: asynchronous
