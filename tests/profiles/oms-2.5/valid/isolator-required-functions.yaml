# Complete profile-validation fixture using deliberately local IDs.
contract_version: "0.1"
service:
  name: profile-isolator
  version: "0.1.0"
  kind: isolator
standards:
  oms_version: "2.5"
  uci_schema_version: "2.5"
functions:
  - id: service-initialization
    name: Service Initialization
    category: required
    required_group: service
    applicability: applicable
    exchanges: []
  - id: service-status
    name: Service Status
    category: required
    required_group: service
    applicability: applicable
    exchanges:
      - id: isolator-status-output
        kind: oms_message
        direction: output
        mandate: mandatory
        message: ServiceStatus
        topic: ServiceStatus
        timing:
          kind: periodic
      - id: isolator-request-input
        kind: oms_message
        direction: input
        mandate: mandatory
        message: ServiceStatusDataRequest
        topic: ServiceStatusDataRequest
        timing:
          kind: asynchronous
      - id: isolator-response-output
        kind: oms_message
        direction: output
        mandate: mandatory
        message: ServiceStatusDataRequestStatus
        topic: ServiceStatusDataRequestStatus
        timing:
          kind: on_demand
